version: '3.8'

services:
  # ============================================================================
  # Zookeeper - Coordination service for both Kafka brokers
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: streaming-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network

  # ============================================================================
  # Kafka Broker for Stock Data
  # ============================================================================
  kafka-stock:
    image: confluentinc/cp-kafka:7.4.0
    container_name: streaming-kafka-stock
    hostname: kafka-stock
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-stock:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - streaming-network

  # ============================================================================
  # Kafka Broker for User Data
  # ============================================================================
  kafka-user:
    image: confluentinc/cp-kafka:7.4.0
    container_name: streaming-kafka-user
    hostname: kafka-user
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-user:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_REPLICA_FETCH_MAX_BYTES: 10485760
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9093", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - streaming-network

  # ============================================================================
  # Producer Container - Runs stock and user producers
  # ============================================================================
  producer:
    build:
      context: ../..
      dockerfile: streaming/docker/Dockerfile.app
    container_name: streaming-producer
    depends_on:
      kafka-stock:
        condition: service_healthy
      kafka-user:
        condition: service_healthy
    volumes:
      - ../..:/app
      - ../../data:/app/data:ro
      - ../../risk_artifacts:/app/risk_artifacts:ro
    environment:
      - KAFKA_BROKER_STOCK=kafka-stock:29092
      - KAFKA_BROKER_USER=kafka-user:29093
      - STOCK_TOPIC=stock_stream
      - USER_TOPIC=user_stream
      - PRODUCER_DELAY_STOCK=50
      - PRODUCER_DELAY_USER=200
      - BASE_DIR=/app
      - DATA_DIR=/app/data
      - PYTHONPATH=/app
    command: ["python", "-m", "streaming.producer.run_producers", "--loop"]
    networks:
      - streaming-network

  # ============================================================================
  # Consumer Container - Runs Pathway consumers + finetune manager
  # ============================================================================
  consumer:
    build:
      context: ../..
      dockerfile: streaming/docker/Dockerfile.app
    container_name: streaming-consumer
    depends_on:
      kafka-stock:
        condition: service_healthy
      kafka-user:
        condition: service_healthy
    volumes:
      - ../..:/app
      - ../../data:/app/data:ro
      - ../../risk_artifacts:/app/risk_artifacts:ro
      - ../output:/app/streaming/output
    environment:
      - KAFKA_BROKER_STOCK=kafka-stock:29092
      - KAFKA_BROKER_USER=kafka-user:29093
      - STOCK_TOPIC=stock_stream
      - USER_TOPIC=user_stream
      - BASE_DIR=/app
      - DATA_DIR=/app/data
      - RISK_ARTIFACTS=/app/risk_artifacts
      - SMARTFOLIO_ROOT=/app/SmartFolio
      - PYTHONPATH=/app
    command: ["python", "-m", "streaming.consumer.run_consumers"]
    networks:
      - streaming-network

networks:
  streaming-network:
    driver: bridge
